name: Deploy to Timeweb

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          source: "."
          target: "/opt/ai-agent"
          overwrite: true

      - name: Create .env file on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/ai-agent
            cat > .env << 'EOF'
            YC_API_KEY="${{ secrets.YC_API_KEY }}"
            YC_FOLDER_ID="${{ secrets.YC_FOLDER_ID }}"
            EOF

      - name: Restart Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/ai-agent
            docker-compose down
            # Предварительно скачиваем тяжёлый базовый образ для browser
            docker pull mcr.microsoft.com/playwright/python:v1.46.0-jammy || true
            docker-compose pull
            docker-compose up -d --build
            docker image prune -f
          # Опционально: увеличить общий таймаут для скрипта (в секундах)
          timeout: 1800s   # 30 минут          
            
