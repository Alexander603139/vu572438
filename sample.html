<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Политический классификатор</title>
    <style>
        /* Базовые стили */
        :root {
            --color-bg-dark: #121212;
            --color-text-light: #E0E0E0;
            --color-accent-blue: #0D47A1; /* Темно-синий */
            --color-border-subtle: rgba(255, 255, 255, 0.1);
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--color-bg-dark);
            color: var(--color-text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            background-color: #1E1E1E;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Вкладки */
        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--color-border-subtle);
        }

        .tab-button {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 10px 0;
            font-size: 1rem;
            color: var(--color-text-light);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab-button.active {
            color: white;
            border-bottom: 3px solid var(--color-accent-blue);
        }

        /* Поле ввода */
        .input-section {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            font-size: 0.9rem;
            color: var(--color-text-light);
            opacity: 0.7;
            margin-bottom: 8px;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid var(--color-border-subtle);
            border-radius: 8px;
            background-color: #2a2a2a;
            color: var(--color-text-light);
            resize: vertical;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--color-accent-blue);
        }

        /* Настройки лимита */
        .limit-settings {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .limit-settings label {
            color: var(--color-text-light);
            opacity: 0.8;
        }

        .limit-settings input[type="number"] {
            -moz-appearance:textfield;
            width: 60px;
            padding: 8px;
            border: 1px solid var(--color-border-subtle);
            border-radius: 6px;
            background-color: #2a2a2a;
            color: var(--color-text-light);
            text-align: center;
        }

        /* Кнопка */
        button {
            background-color: var(--color-accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, background-color 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button::before {
            content: attr(data-top-text);
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
            background-color: #0b3d81;
        }

        button:hover::before {
            opacity: 1;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .tabs {
                grid-template-columns: 1fr;
                border-bottom: none;
                border-left: 1px solid var(--color-border-subtle);
                display: flex;
                flex-direction: column;
            }

            .tab-button {
                border-right: none;
                border-bottom: 1px solid transparent;
            }

            .tab-button.active {
                border-bottom: 3px solid var(--color-accent-blue);
            }

            .limit-settings {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .limit-settings input[type="number"] {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Политический классификатор</h1>

    <!-- Табы -->
    <div class="tabs">
        <button class="tab-button active" data-target="text">Анализ одного текста</button>
        <button class="tab-button" data-target="sites">Анализ сайтов</button>
        <button class="tab-button" data-target="phrases">Ключевые фразы</button>
    </div>

    <!-- Окно ввода -->
    <div class="input-section">
        <label for="user-input" id="input-label">Введите текст для анализа</label>
        <textarea id="user-input" placeholder="Например: "></textarea>
    </div>

    <!-- Блок настроек (скрыт по умолчанию) -->
    <div id="limit-settings" class="limit-settings" style="display: none;">
        <label for="limit-value" id="limit-label"></label>
        <input type="number" id="limit-value" value="5" min="1" max="50">
    </div>

    <!-- Кнопка действия -->
    <button id="action-button" data-top-text="Анализировать">Анализировать</button>
</div>

<script>
    const tabs = document.querySelectorAll('.tab-button');
    const userInput = document.getElementById('user-input');
    const inputLabel = document.getElementById('input-label');
    const limitSettings = document.getElementById('limit-settings');
    const limitLabel = document.getElementById('limit-label');
    const limitValue = document.getElementById('limit-value');
    const actionButton = document.getElementById('action-button');

    // Конфигурация для каждой вкладки
    const tabConfig = {
        text: {
            label: 'Введите текст для анализа',
            showLimit: false,
            buttonText: 'Анализировать'
        },
        sites: {
            label: 'Введите список URL (по одному на строку)',
            showLimit: true,
            limitLabel: 'Максимум статей на сайт:',
            buttonText: 'Анализировать сайты'
        },
        phrases: {
            label: 'Выделение ключевых фраз по категориям',
            showLimit: true,
            limitLabel: 'Максимум фраз на категорию:',
            buttonText: 'Извлечь ключевые фразы'
        }
    };

    function selectTab(target) {
        // Убираем активный класс у всех табов
        tabs.forEach(tab => tab.classList.remove('active'));
        // Добавляем активный класс выбранному табу
        document.querySelector(`.tab-button[data-target="${target}"]`).classList.add('active');

        // Обновляем интерфейс согласно выбранной вкладке
        const config = tabConfig[target];
        inputLabel.textContent = config.label;
        actionButton.textContent = config.buttonText;
        actionButton.setAttribute('data-top-text', config.buttonText);

        if (config.showLimit) {
            limitSettings.style.display = 'flex';
            limitLabel.textContent = config.limitLabel;
        } else {
            limitSettings.style.display = 'none';
        }
    }

    // Обработчик клика по табам
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.dataset.target;
            selectTab(target);
        });
    });

    // Устанавливаем состояние по умолчанию при загрузке страницы
    selectTab('text'); // Активируем первую вкладку

</script>
</body>
</html>
