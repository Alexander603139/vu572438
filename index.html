<!DOCTYPE html>
<html>
<head>
    <title>Политический классификатор</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; max-width: 1000px; margin: 50px auto; padding: 20px; }
        .tab { overflow: hidden; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .tab button { background-color: gainsboro; float: left; border: none; outline: none; cursor: pointer; padding: 10px 20px; transition: 0.3s; font-size: 16px; }
        .tab button:hover { background-color: #aad; }
        .tab button.active { background-color: blueviolet; color: white; }
        .tabcontent { display: none; }
        textarea { width: 100%; height: 150px; padding: 10px; }
        input[type="number"] { width: 80px; }
        button { padding: 10px 20px; background: blueviolet; color: white; border: none; cursor: pointer; margin-top: 10px; }
        .btn-clear { background: #888; }
        .btn-export { background: green; }
        .error { color: red; }
        .article-preview { font-size: 12px; color: #555; margin-top: 5px; }
        details { margin-bottom: 10px; }
        summary { cursor: pointer; font-weight: bold; }
        #progress-container { width: 100%; background: #eee; border-radius: 5px; margin: 10px 0; display: none; }
        #progress-bar { width: 0%; height: 20px; background: blueviolet; border-radius: 5px; text-align: center; color: white; line-height: 20px; }
        #progress-status { margin-top: 5px; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>

<h1>Политический классификатор текста и новостных сайтов</h1>

<div class="tab">
    <button class="tablinks" onclick="openTab(event, 'Single')" id="defaultOpen">Анализ одного текста</button>
    <button class="tablinks" onclick="openTab(event, 'Sites')">Анализ сайтов</button>
    <button class="tablinks" onclick="openTab(event, 'Keywords')">Ключевые фразы</button>
    <button class="tablinks" onclick="openTab(event, 'Admin')">Администрирование</button>
</div>

<!-- Вкладка 1: один текст -->
<div id="Single" class="tabcontent">
    <h3>Введите текст для анализа</h3>
    <textarea id="singleText" placeholder="Вставьте текст новости или статьи..."></textarea>
    <br>
    <div class="flex">
        <button onclick="analyzeSingle()">Анализировать</button>
        <button class="btn-clear" onclick="document.getElementById('singleText').value=''; document.getElementById('singleResult').innerHTML='';">Очистить</button>
    </div>
    <div id="singleResult" style="margin-top: 20px;"></div>
    <div class="flex" style="margin-top:10px;">
        <button class="btn-export" onclick="exportSingleJSON()">Скачать JSON</button>
        <button class="btn-export" onclick="exportSingleCSV()">Скачать CSV</button>
    </div>
</div>

<!-- Вкладка 2: анализ сайтов -->
<div id="Sites" class="tabcontent">
    <h3>Введите список URL (по одному на строку)</h3>
    <!-- <textarea id="urls" placeholder="https://ria.ru&#10;https://meduza.io&#10;https://tass.ru"></textarea> -->
    <textarea id="urls" placeholder="Допустимые варианты:&#10;site.ru&#10;www.site.ru&#10;https://site.ru&#10;https://site.ru/"></textarea>
    <br>
    <label>Максимум статей на сайт: <input type="number" id="maxArticles" value="5" min="1" max="10"></label>
    <br>
    <div class="flex">
        <button onclick="analyzeSites()">Анализировать сайты</button>
        <button class="btn-clear" onclick="document.getElementById('urls').value=''; document.getElementById('sitesResult').innerHTML=''; document.getElementById('progress-container').style.display='none';">Очистить</button>
    </div>
    <div id="progress-container">
        <div id="progress-bar">0%</div>
        <div id="progress-status">Готовимся...</div>
    </div>
    <div id="sitesResult" style="margin-top: 20px;"></div>
    <div class="flex" style="margin-top:10px;">
        <button class="btn-export" onclick="exportSitesJSON()">Скачать JSON</button>
        <button class="btn-export" onclick="exportSitesCSV()">Скачать CSV</button>
    </div>
</div>

<!-- Вкладка 3: ключевые фразы -->
<div id="Keywords" class="tabcontent">
    <h3>Выделение ключевых фраз по категориям</h3>
    <textarea id="keywordsText" placeholder="Вставьте текст..."></textarea>
    <br>
    <label>Максимум фраз на категорию: <input type="number" id="maxKeywords" value="5" min="1" max="10"></label>
    <br>
    <div class="flex">
        <button onclick="extractKeywords()">Извлечь ключевые фразы</button>
        <button class="btn-clear" onclick="document.getElementById('keywordsText').value=''; document.getElementById('keywordsResult').innerHTML='';">Очистить</button>
    </div>
    <div id="keywordsResult" style="margin-top: 20px;"></div>
</div>

<!-- Вкладка 4: администрирование -->
<div id="Admin" class="tabcontent">
    <h3>Добавление few-shot примера</h3>
    <label>Категория:</label>
    <select id="exampleCategory">
        <option value="economic_left">Экономические левые</option>
        <option value="economic_right">Экономические правые</option>
        <option value="social_liberal">Социально-либертарные</option>
        <option value="social_authoritarian">Социально-авторитарные</option>
    </select>
    <br><br>
    <label>Текст примера:</label><br>
    <textarea id="exampleText" rows="4" cols="50" placeholder="Введите предложение, характерное для выбранной категории..."></textarea>
    <br>
    <div class="flex">
        <button onclick="addExample()">Добавить пример</button>
        <button class="btn-clear" onclick="document.getElementById('exampleText').value=''; document.getElementById('adminResult').innerHTML='';">Очистить</button>
    </div>
    <div id="adminResult" style="margin-top: 20px;"></div>
</div>

<script>
// ========== БАЗОВЫЙ URL ДЛЯ API (АБСОЛЮТНЫЙ) ==========
const API_BASE = 'http://186.246.14.209:8000';

// ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
function openTab(evt, tabName) {
    var i, tabcontent, tablinks;
    tabcontent = document.getElementsByClassName("tabcontent");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }
    tablinks = document.getElementsByClassName("tablinks");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
    }
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.className += " active";
}
document.getElementById("defaultOpen").click();

// ========== ОБЩАЯ ФУНКЦИЯ ДЛЯ ОБРАБОТКИ ОШИБОК ==========
async function handleFetch(url, options) {
    try {
        const response = await fetch(url, options);
        if (!response.ok) {
            let detail = response.statusText;
            try {
                const errData = await response.json();
                if (errData.detail) detail = errData.detail;
            } catch(e) {}
            throw new Error(`Ошибка ${response.status}: ${detail}`);
        }
        return await response.json();
    } catch (error) {
        if (error.name === 'AbortError' || error.message.includes('timeout')) {
            throw new Error('Превышено время ожидания ответа от сервера.');
        }
        if (error.message.includes('NetworkError') || !navigator.onLine) {
            throw new Error('Сервер временно недоступен. Проверьте подключение к интернету.');
        }
        throw error;
    }
}

// ========== ВКЛАДКА "ОДИН ТЕКСТ" ==========
async function analyzeSingle() {
    const text = document.getElementById('singleText').value.trim();
    if (!text) {
        document.getElementById('singleResult').innerHTML = '<span class="error">Введите текст для анализа.</span>';
        return;
    }
    const resultDiv = document.getElementById('singleResult');
    resultDiv.innerHTML = 'Анализ...';
    try {
        const data = await handleFetch(API_BASE + '/classify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        resultDiv.innerHTML = `<pre>${data.result}</pre>`;
        window._singleData = data;
    } catch (error) {
        resultDiv.innerHTML = `<span class="error">${error.message}</span>`;
    }
}

function exportSingleJSON() {
    if (!window._singleData) { alert('Сначала выполните анализ.'); return; }
    downloadFile(JSON.stringify(window._singleData, null, 2), 'single_result.json', 'application/json');
}

function exportSingleCSV() {
    if (!window._singleData) { alert('Сначала выполните анализ.'); return; }
    const resultStr = window._singleData.result;
    const csv = 'Результат\n"' + resultStr.replace(/"/g, '""') + '"';
    downloadFile(csv, 'single_result.csv', 'text/csv');
}

// ========== ВКЛАДКА "АНАЛИЗ САЙТОВ" ==========
let sitesEventSource = null;
let sitesRawData = [];

async function analyzeSites() {
    const urlsText = document.getElementById('urls').value;
    // const urls = urlsText.split('\n').filter(u => u.trim().length > 0);
    const rawUrls = urlsText.split('\n').filter(u => u.trim().length > 0);
    const urls = rawUrls.map(u => {
        let url = u.trim();
        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;   // добавляем протокол, если отсутствует
        }
        return url;
    });
    const maxArticles = parseInt(document.getElementById('maxArticles').value) || 5;
    if (urls.length === 0) {
        document.getElementById('sitesResult').innerHTML = '<span class="error">Введите хотя бы один URL.</span>';
        return;
    }
    for (let u of urls) {
        try { new URL(u); } catch(e) {
            document.getElementById('sitesResult').innerHTML = `<span class="error">Некорректный URL: ${u}</span>`;
            return;
        }
    }

    const resultDiv = document.getElementById('sitesResult');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressStatus = document.getElementById('progress-status');
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressBar.textContent = '0%';
    progressStatus.textContent = 'Подключение...';
    resultDiv.innerHTML = '';

    if (sitesEventSource) {
        sitesEventSource.close();
        sitesEventSource = null;
    }

    const params = new URLSearchParams();
    urls.forEach(u => params.append('urls', u));
    params.append('max_articles_per_site', maxArticles);
    const eventUrl = API_BASE + '/analyze_sites_stream?' + params.toString();

    sitesEventSource = new EventSource(eventUrl);
    sitesRawData = [];

    sitesEventSource.addEventListener('start', function(e) {
        const data = JSON.parse(e.data);
        progressStatus.textContent = `Начинаем обработку ${data.total} сайтов...`;
    });

    sitesEventSource.addEventListener('site_start', function(e) {
        const data = JSON.parse(e.data);
        progressStatus.textContent = `Обработка сайта ${data.index+1}: ${data.url}`;
    });

    sitesEventSource.addEventListener('article', function(e) {
        const data = JSON.parse(e.data);
        progressStatus.textContent += ` (статья ${data.url})`;
    });

    sitesEventSource.addEventListener('site_done', function(e) {
        const data = JSON.parse(e.data);
        sitesRawData.push(data);
        const total = sitesRawData.length;
        const all = parseInt(progressStatus.textContent.match(/обработку (\d+)/)?.[1] || total);
        const percent = Math.min(100, Math.round((total / all) * 100));
        progressBar.style.width = percent + '%';
        progressBar.textContent = percent + '%';
        progressStatus.textContent = `Завершён сайт ${data.url}`;
        appendSiteResult(data);
    });

    sitesEventSource.addEventListener('site_error', function(e) {
        const data = JSON.parse(e.data);
        progressStatus.textContent = `Ошибка на сайте ${data.url}: ${data.error}`;
        resultDiv.innerHTML += `<div class="error"><strong>${data.url}</strong>: ${data.error}</div>`;
    });

    sitesEventSource.addEventListener('done', function(e) {
        sitesEventSource.close();
        sitesEventSource = null;
        progressBar.style.width = '100%';
        progressBar.textContent = '100%';
        progressStatus.textContent = 'Анализ завершён!';
        window._sitesData = sitesRawData;
    });

    sitesEventSource.onerror = function(e) {
        if (sitesEventSource) {
            sitesEventSource.close();
            sitesEventSource = null;
        }
        progressStatus.textContent = 'Ошибка соединения с сервером. Попробуйте позже.';
        resultDiv.innerHTML += '<div class="error">Сервер временно недоступен.</div>';
    };
}

function appendSiteResult(data) {
    const resultDiv = document.getElementById('sitesResult');
    let html = `<details><summary><strong>${data.url}</strong> (статей: ${data.articles_parsed})</summary>`;
    html += `<div style="margin:10px 0;"><strong>Результат классификации:</strong><br>`;
    const categoriesOrder = ["Экономические левые", "Экономические правые", "Социально-либертарные", "Социально-авторитарные"];
    for (let cat of categoriesOrder) {
        const perc = data.distribution[cat] || 0;
        html += `  ${cat}: ${perc}%<br>`;
    }
    html += `Уверенность ИИ: ${data.avg_confidence}<br></div>`;
    html += '<h4>Статьи:</h4><ul>';
    for (let art of data.articles) {
        html += `<li><strong><a href="${art.url}" target="_blank">${art.url}</a></strong><br>`;
        html += `<span class="article-preview">Превью: ${art.preview}</span><br>`;
        html += `Распределение: `;
        for (let [cat, perc] of Object.entries(art.distribution)) {
            html += `${cat} ${perc}%; `;
        }
        html += `<br>Уверенность: ${art.confidence}</li>`;
    }
    html += `</ul></details><hr>`;
    resultDiv.innerHTML += html;
}

function exportSitesJSON() {
    if (!window._sitesData) { alert('Сначала выполните анализ сайтов.'); return; }
    downloadFile(JSON.stringify(window._sitesData, null, 2), 'sites_result.json', 'application/json');
}

function exportSitesCSV() {
    if (!window._sitesData) { alert('Сначала выполните анализ сайтов.'); return; }
    const rows = [['Сайт', 'URL статьи', 'Превью', 'Категория', 'Процент', 'Уверенность']];
    for (let site of window._sitesData) {
        for (let art of site.articles) {
            for (let [cat, perc] of Object.entries(art.distribution)) {
                rows.push([
                    site.url,
                    art.url,
                    art.preview,
                    cat,
                    perc,
                    art.confidence || site.avg_confidence || ''
                ]);
            }
        }
    }
    const csvContent = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
    downloadFile(csvContent, 'sites_result.csv', 'text/csv');
}

async function extractKeywords() {
    const text = document.getElementById('keywordsText').value.trim();
    if (!text) {
        document.getElementById('keywordsResult').innerHTML = '<span class="error">Введите текст для анализа.</span>';
        return;
    }
    const maxPerCategory = parseInt(document.getElementById('maxKeywords').value) || 5;
    const resultDiv = document.getElementById('keywordsResult');
    resultDiv.innerHTML = 'Извлечение...';
    try {
        const data = await handleFetch(API_BASE + '/keywords', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, max_per_category: maxPerCategory })
        });
        let html = '<h3>Ключевые фразы по категориям:</h3>';
        for (let [cat, items] of Object.entries(data.keywords)) {
            html += `<strong>${cat}</strong><ul>`;
            for (let item of items) {
                // item = { phrase, context }
                const phrase = item.phrase || item; // для обратной совместимости
                let context = item.context || '';
                if (context) {
                    // Экранируем HTML и показываем контекст серым цветом
                    html += `<li><span style="font-weight:bold;">${escapeHtml(phrase)}</span> <span style="color:#666; font-size:0.9em;">(…${escapeHtml(context)}…)</span></li>`;
                } else {
                    html += `<li>${escapeHtml(phrase)}</li>`;
                }
            }
            html += `</ul>`;
        }
        resultDiv.innerHTML = html;
        window._keywordsData = data;
    } catch (error) {
        resultDiv.innerHTML = `<span class="error">${error.message}</span>`;
    }
}

// Вспомогательная функция для экранирования HTML
function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}


// ========== ВКЛАДКА "АДМИНИСТРИРОВАНИЕ" ==========
async function addExample() {
    const category = document.getElementById('exampleCategory').value;
    const text = document.getElementById('exampleText').value.trim();
    if (!text) {
        document.getElementById('adminResult').innerHTML = '<span class="error">Введите текст примера.</span>';
        return;
    }
    const resultDiv = document.getElementById('adminResult');
    resultDiv.innerHTML = 'Отправка...';
    try {
        const auth = btoa('admin:admin123');
        const data = await handleFetch(API_BASE + '/admin/add_example', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Basic ${auth}`
            },
            body: JSON.stringify({ category, text })
        });
        resultDiv.innerHTML = '<span style="color:green;">Пример успешно добавлен!</span>';
        document.getElementById('exampleText').value = '';
    } catch (error) {
        resultDiv.innerHTML = `<span class="error">${error.message}</span>`;
    }
}

// ========== ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ДЛЯ СКАЧИВАНИЯ ==========
function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}
