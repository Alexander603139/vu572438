version: '3.8'

networks:
  monitoring:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - monitoring

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./political_markers.yml:/app/political_markers.yml:ro
    environment:
      YC_API_KEY: ${YC_API_KEY}
      YC_FOLDER_ID: ${YC_FOLDER_ID}
    depends_on:
      - ai_classifier
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ai-agent-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  ai_classifier:
    build:
      context: .
      dockerfile: Dockerfile.ai_classifier
    container_name: ai-agent-ai-classifier
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./political_markers.yml:/app/political_markers.yml:ro
      - ./samples:/app/samples:ro   # если у вас есть папка samples
    environment:
      YC_API_KEY: ${YC_API_KEY}
      YC_FOLDER_ID: ${YC_FOLDER_ID}
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    networks:
      - monitoring