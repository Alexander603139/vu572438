version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./political_markers.yml:/app/political_markers.yml:ro
      # - ./political_markers.yml:/opt/ai-agent/political_markers.yml:ro
    environment:
      YC_API_KEY: ${YC_API_KEY}
      YC_FOLDER_ID: ${YC_FOLDER_ID}
    depends_on:
      - ai_classifier
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ai-agent-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  ai_classifier:
    build:
      context: .
      dockerfile: Dockerfile.ai_classifier
    container_name: ai-agent-ai-classifier
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      YC_API_KEY: ${YC_API_KEY}
      YC_FOLDER_ID: ${YC_FOLDER_ID}
    env_file:
      - .env